# =============================================================
# VidSage — Production Docker Compose (v2 — Production Hardened)
# =============================================================
#
# Services: Redis → Backend → Celery Worker → Frontend → Nginx
#
# Usage:
#   make up              # Start everything
#   make logs            # View logs
#   make health          # Check health
#   make backup          # Create backup
#   make scale-workers   # Scale celery workers
#
# =============================================================

services:
  # ── Redis ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Backend API (FastAPI + Gunicorn) ─────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    volumes:
      - uploads_data:/app/app/uploads
      - downloads_data:/app/app/downloads
      - chroma_data:/app/chroma_db
      - cookie_data:/app/cookies
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G    # Whisper + ML models need memory

  # ── Celery Worker ────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
    command: celery -A app.celery_app worker -l info --concurrency=2 --max-tasks-per-child=50
    volumes:
      - uploads_data:/app/app/uploads
      - downloads_data:/app/app/downloads
      - chroma_data:/app/chroma_db
      - cookie_data:/app/cookies
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Frontend (Next.js standalone) ────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Nginx Reverse Proxy ─────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

# ── Persistent Volumes ───────────────────────────────
volumes:
  redis_data:
  uploads_data:
  downloads_data:
  chroma_data:
  cookie_data:
  nginx_logs: