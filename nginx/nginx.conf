# ── Upstream definitions ────────────────────────────────────
upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

# ── Rate limiting zones (shared memory) ────────────────────
# These protect against DDoS and abuse BEFORE reaching FastAPI
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=120r/m;

# ── Connection limits ──────────────────────────────────────
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Main server ────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    client_max_body_size 500M;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Connection limit per IP
    limit_conn conn_limit 50;

    # ── Security Headers ────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Hide server version ─────────────────────────────────
    server_tokens off;
    more_clear_headers "Server";

    # ── Block common attack paths ───────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* ^/(wp-admin|wp-login|xmlrpc\.php|\.env|\.git|config\.(yml|yaml|json)) {
        deny all;
        return 404;
    }

    # ── Auth endpoints — strict rate limit ──────────────────
    location ~ ^/api/auth/(login|token) {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Upload endpoints — strict rate limit ────────────────
    location ~ ^/api/(upload|video) {
        limit_req zone=upload_limit burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for uploads
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ── Backend API — standard rate limit ───────────────────
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Backend health/docs/root ────────────────────────────
    location ~ ^/(health|about|docs|openapi.json|redoc)$ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend ────────────────────────────────────────────
    location / {
        limit_req zone=global_limit burst=20 nodelay;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 30d;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Custom error pages ──────────────────────────────────
    error_page 429 /429.html;
    error_page 502 503 504 /50x.html;

    location = /429.html {
        default_type application/json;
        return 429 '{"detail": "Too many requests. Please try again later.", "retry_after": 60}';
    }

    location = /50x.html {
        default_type application/json;
        return 503 '{"detail": "Service temporarily unavailable. Please try again later."}';
    }
}