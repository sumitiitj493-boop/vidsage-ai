global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # VidSage Backend
  - job_name: "vidsage-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
    scrape_interval: 10s

  # Redis
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  # Nginx (if nginx-prometheus-exporter is added)
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:80"]
